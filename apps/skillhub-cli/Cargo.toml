[package]
name = "skillhub-cli"
version = "0.1.0"
edition = "2021"
description = "SkillHub — cross-harness skill package manager CLI"
license = "MIT"

[[bin]]
name = "skillhub"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
ureq = { version = "2", features = ["json"] }
regex = "1"
walkdir = "2"
sha2 = "0.10"
ed25519-dalek = "2"
base64 = "0.22"

[profile.release]
lto = true
strip = true

# cargo-dist installers (produces install.sh/Homebrew; .deb/.rpm via the release pipeline)
[workspace.metadata.dist]
cargo-dist-version = "0.28.0"
installers = ["shell", "homebrew", "cargo"]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "aarch64-apple-darwin"]
