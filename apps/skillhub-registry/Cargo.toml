[package]
name = "skillhub-registry"
version = "0.1.0"
edition = "2021"
description = "SkillHub — skill registry API (axum + SQLite)"
license = "MIT"

[[bin]]
name = "skillhub-registry"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
jsonschema = "0.24"
ed25519-dalek = "2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
