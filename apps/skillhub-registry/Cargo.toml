[package]
name = "skillhub-registry"
version = "0.1.0"
edition = "2021"
description = "SkillHub — skill registry API (axum + SQLite)"

[[bin]]
name = "skillhub-registry"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
