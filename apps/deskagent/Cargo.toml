# DeskAgent Cargo workspace — the Tauri shell (src-tauri), the pure memory core
# (crates/deskagent-core), and the terminal-UI CLI (crates/deskagent-cli).
# `cargo check` / `cargo test` run from apps/deskagent cover all three.
[workspace]
resolver = "2"
members = ["src-tauri", "src-tauri/crates/deskagent-core", "src-tauri/crates/deskagent-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

# cargo-dist installers for the `deskagent` CLI (Tauri GUI excluded/deferred)
[workspace.metadata.dist]
cargo-dist-version = "0.28.0"
installers = ["shell", "homebrew", "cargo"]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "aarch64-apple-darwin"]
