[package]
name = "deskagent"
version.workspace = true
edition.workspace = true
repository = "https://github.com/MerverliPy/agent-ecosystem"
license.workspace = true
description = "DeskAgent — Tauri 2 shell over the deskagent-core memory system"

[lib]
name = "deskagent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
deskagent-core = { path = "crates/deskagent-core" }
