# Release pipeline — triggered on a `v<version>` tag push (or manual dispatch).
#
# Full-inventory release for linux (amd64/arm64) + macOS (arm64/amd64):
#   checks  -> install Node + system deps, run the general validation surrogate (run-all-checks)
#   build   -> matrix: build skillhub + deskagent-cli per target, staged with per-target names
#   publish -> collect all binaries, web static dists, action; sign + SBOM + checksum; run
#              release-gate; push registry container to GHCR; npm-publish slopgate (gated);
#              upload everything to the GitHub Release.
# DEC-0005 compliant: no telemetry.
#
# Required repo secrets (only when the gated steps should run):
#   RELEASE_GPG_KEY (+ GPG_KEY_ID)  — armored signing key for artifact signatures
#   NPM_TOKEN                       — for `npm publish` of apps/slopgate
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  # linux-arm64 cross linker (installed in the build matrix below)
  CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

jobs:
  # ---- 1. general validation surrogate, with dependencies installed ----
  checks:
    name: checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      # Tauri shell `cargo check` needs WebKit/GTK on Linux
      - name: install webkit/gtk system deps
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev
      # clean runners have no node_modules; install every app that run-all-checks exercises.
      # Apps with no package-lock.json (e.g. slopgate-action, which has zero deps) are skipped.
      - name: npm ci (all apps)
        run: |
          set -e
          for d in slopgate slopgate-action slopgate-dash bench-site skillhub-web deskagent; do
            if [ -f "apps/$d/package-lock.json" ]; then
              echo "== npm ci apps/$d =="
              (cd "apps/$d" && npm ci --no-audit --no-fund)
            else
              echo "== skip apps/$d (no package-lock.json) =="
            fi
          done
      - name: run-all-checks
        run: bash scripts/run-all-checks.sh

  # ---- 2. build the two Rust CLIs per target (per-target names) ----
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04, target: aarch64-unknown-linux-gnu }
          - { os: macos-14,    target: x86_64-apple-darwin }
          - { os: macos-14,    target: aarch64-apple-darwin }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: install linux-arm64 cross linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: build skillhub
        run: cargo build --release --manifest-path apps/skillhub-cli/Cargo.toml --target ${{ matrix.target }}
      - name: build deskagent-cli
        run: cargo build --release --manifest-path apps/deskagent/Cargo.toml -p deskagent-cli --target ${{ matrix.target }}
      - name: stage binaries (per-target names)
        run: |
          mkdir -p dist/release
          cp apps/skillhub-cli/target/${{ matrix.target }}/release/skillhub dist/release/skillhub-${{ matrix.target }}
          cp apps/deskagent/target/${{ matrix.target }}/release/deskagent dist/release/deskagent-${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/release/

  # ---- 3. assemble the full inventory, prove it, and publish ----
  publish:
    name: publish
    runs-on: ubuntu-22.04
    needs: [checks, build]
    # job-level env makes the secrets visible to step `if:` conditions (secrets aren't allowed
    # directly in step `if`). Empty when a secret is not configured -> the gated step is skipped.
    env:
      RELEASE_GPG_KEY: ${{ secrets.RELEASE_GPG_KEY }}
      GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: download all target binaries
        uses: actions/download-artifact@v4
        with:
          path: dist/release
          pattern: release-*
          merge-multiple: true
      - name: npm ci (web apps)
        run: |
          set -e
          for d in bench-site skillhub-web slopgate-dash; do
            echo "== npm ci apps/$d =="
            (cd "apps/$d" && npm ci --no-audit --no-fund)
          done
      - name: build web static dists
        run: bash scripts/build-web-dist.sh
      - name: assemble web + action into release
        run: |
          mkdir -p dist/release
          # dirs (release-gate checks these) + tarballs (attached to the GitHub Release)
          cp -r dist/web dist/release/web
          mkdir -p /tmp/action && cp apps/slopgate-action/{action.yml,main.mjs,package.json} /tmp/action/
          cp -r /tmp/action dist/release/slopgate-action
          tar -czf dist/release/web.tar.gz -C dist/web .
          tar -czf dist/release/slopgate-action.tar.gz -C /tmp/action .
      # optional cargo-dist installers (.deb/.rpm/homebrew) — best effort; requires prior
      # `cargo dist init`. If not initialized, installers are omitted (does not fail the gate).
      # Native installers (install.sh + Homebrew formula + tar.xz + checksums) for linux amd64,
      # produced by cargo-dist for the publish host. `allow-dirty=["ci"]` in each workspace lets
      # cargo-dist build without owning this workflow. Best-effort; the gate does not require it.
      - name: cargo-dist installers (linux amd64)
        continue-on-error: true
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo install cargo-dist --locked >/dev/null 2>&1 || true
          for w in skillhub-cli deskagent; do
            (cd "apps/$w" && dist build --target x86_64-unknown-linux-gnu --artifacts=all) >/dev/null 2>&1 || true
          done
          # copy per-app installers (skip shared source.tar.gz / sha256.sum collisions)
          find apps -path '*/target/distrib/*' -type f \
            \( -name '*-installer.sh' -o -name '*.rb' -o -name '*-x86_64-unknown-linux-gnu.tar.xz' -o -name '*.tar.xz.sha256' \) \
            -exec cp -f {} dist/release/ \; 2>/dev/null || true
      # import the signing key first so the checksum signature is produced with it
      - name: import signing key
        if: env.RELEASE_GPG_KEY != ''
        run: echo "$RELEASE_GPG_KEY" | gpg --batch --import
      - name: checksums + sign
        run: bash scripts/sign-artifacts.sh dist/release
      - name: SBOM
        run: bash scripts/gen-sbom.sh dist/release
      - name: release-gate
        run: bash scripts/release-gate.sh dist/release

      # registry container -> GHCR (uses the default GITHUB_TOKEN; packages: write granted above)
      - name: login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build + push registry container
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/skillhub-registry/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/agent-ecosystem/skillhub-registry:v0.1.0
            ghcr.io/${{ github.repository_owner }}/agent-ecosystem/skillhub-registry:latest

      # npm publish of slopgate (only if NPM_TOKEN secret is configured)
      - name: publish slopgate to npm
        if: env.NPM_TOKEN != ''
        run: |
          cd apps/slopgate
          npm pack --dry-run
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          npm publish --access public

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/release/*
          generate_release_notes: true
